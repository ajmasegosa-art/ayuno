name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm ci
      - name: Preparar Android
        run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Ayuno.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ayuno-APK
          path: Ayuno.apk
      - name: Publicar APK para descarga directa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Ayuno (compilación ${{ github.run_number }})
          body: "Descarga Ayuno.apk e instálala en el móvil."
          files: Ayuno.apk
          make_latest: true
